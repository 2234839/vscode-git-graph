<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- 背景 git graph -->
  <g fill="none" stroke-linecap="round" opacity="0.2">
    <line x1="200" y1="100" x2="200" y2="924" stroke="#60a5fa" stroke-width="4"/>
    <line x1="512" y1="100" x2="512" y2="924" stroke="#34d399" stroke-width="4"/>
    <line x1="824" y1="100" x2="824" y2="924" stroke="#a78bfa" stroke-width="4"/>
    <path d="M 200 300 Q 356 300 512 380" stroke="#60a5fa" stroke-width="4"/>
    <path d="M 824 250 Q 668 250 512 330" stroke="#a78bfa" stroke-width="4"/>
    <path d="M 512 580 Q 668 580 824 680" stroke="#34d399" stroke-width="4"/>
    <path d="M 200 750 Q 356 750 512 830" stroke="#60a5fa" stroke-width="4"/>
  </g>
  <g opacity="0.25">
    <circle cx="200" cy="160" r="12" fill="#60a5fa"/>
    <circle cx="200" cy="500" r="12" fill="#60a5fa"/>
    <circle cx="200" cy="880" r="12" fill="#60a5fa"/>
    <circle cx="512" cy="100" r="12" fill="#34d399"/>
    <circle cx="512" cy="440" r="12" fill="#34d399"/>
    <circle cx="512" cy="720" r="12" fill="#34d399"/>
    <circle cx="824" cy="190" r="12" fill="#a78bfa"/>
    <circle cx="824" cy="520" r="12" fill="#a78bfa"/>
    <circle cx="824" cy="840" r="12" fill="#a78bfa"/>
  </g>

  <!-- G 字母：用 sans-serif bold 保证跨平台一致 -->
  <text x="512" y="540"
        font-family="Arial, Helvetica, sans-serif"
        font-size="660"
        font-weight="900"
        fill="url(#gFill)"
        text-anchor="middle"
        dominant-baseline="central">G</text>
</svg>
