<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Git Graph — Graph/Table Alignment Replay Harness</title>
<!--
  图表节点与 commit 行对齐问题的回放 harness。

  原理：伪装成 VS Code webview 环境（acquireVsCodeApi + initialState 假后端），
  加载真实的 media/out.min.js bundle，驱动 app 完成「加载 500 → refresh 变 503 → load more 到 1003」
  三个场景，由 verify.js 量取每个 SVG 圆点 cy 与对应表格行中心的偏差。

  断言脚本见同目录 verify.js，登记见 README.md。
-->
<link rel="stylesheet" href="../../../media/out.min.css">
<style>
  /* VS Code Dark+ 主题变量 —— webview 里由 VS Code 注入，浏览器环境需手动补全 */
  :root {
    --vscode-editor-background:#1e1e1e;
    --vscode-editor-foreground:#d4d4d4;
    --vscode-menu-background:#252526;
    --vscode-menu-foreground:#cccccc;
    --vscode-widget-shadow:rgba(0,0,0,.5);
    --vscode-focusBorder:#007fd4;
    --vscode-textLink-foreground:#3794ff;
    --vscode-textLink-activeForeground:#3794ff;
    --vscode-charts-yellow:#cca700;
    --vscode-descriptionForeground:rgba(204,204,204,.7);
    --vscode-selection-background:#264f78;
    --vscode-findMatchHighlightBackground:rgba(234,158,52,.55);
    --vscode-font-family:system-ui,'Segoe UI',sans-serif;
    --vscode-button-background:#0e639c;
    --vscode-button-foreground:#ffffff;
    --vscode-button-hoverBackground:#1177bb;
    --vscode-button-secondaryBackground:#3a3d41;
    --vscode-button-secondaryForeground:#ffffff;
    --vscode-editor-findMatchHighlightBorder:#ffe059;
    --vscode-editorSuggestWidget-foreground:#d4d4d4;
    --vscode-editorWidget-background:#252526;
    --vscode-gitDecoration-addedResourceForeground:#81b88b;
    --vscode-gitDecoration-deletedResourceForeground:#c74e39;
    --vscode-gitDecoration-modifiedResourceForeground:#e2c08d;
    --vscode-input-background:#3c3c3c;
    --vscode-input-border:#3c3c3c;
    --vscode-input-foreground:#cccccc;
    --vscode-inputOption-activeBackground:rgba(0,127,212,.4);
    --vscode-inputOption-activeBorder:#007fd4;
    --vscode-input-placeholderForeground:#a6a6a6;
    --vscode-inputValidation-errorBackground:#5a1d1d;
    --vscode-inputValidation-errorBorder:#be1100;
    --vscode-menu-border:#454545;
    --vscode-menu-selectionBackground:#094771;
    --vscode-menu-selectionBorder:#0078d4;
    --vscode-menu-selectionForeground:#cccccc;
    --vscode-menu-separatorBackground:#6b6b6b;
    color-scheme:dark;
  }
  /* VS Code webview 默认会注入 body 字色/字体，浏览器环境必须自己给，否则文字默认黑色压深背景 = 全黑 */
  body {
    color: var(--vscode-editor-foreground);
    font-family: var(--vscode-font-family);
  }
  #harnessVerdict {
    position: fixed; right: 8px; bottom: 8px; z-index: 99999;
    font: 12px monospace; padding: 6px 10px; border-radius: 4px;
    background: #252526; color: #ccc; border: 1px solid #555;
  }
</style>
</head>
<body class="vscode-dark">
<div id="app"></div>
<div id="harnessVerdict">harness ready</div>
<script>
(function () {
	'use strict';

	/* 隐藏页面中 rAF 永不触发（App.vue 用 rAF 调度 initEngine），用 setTimeout 等价替换 */
	if (!window.__ggRealRaf) {
		window.__ggRealRaf = window.requestAnimationFrame;
		window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(performance.now()); }, 16); };
		window.cancelAnimationFrame = function (id) { clearTimeout(id); };
	}

	/** 基准时间（unix 秒，后端 date 字段单位就是秒） */
	var NOW = 1760000000;
	var REPO = '/tmp/test-repo';
	/** 假仓库的提交总数，场景通过 __gg.setTotal 调整（初始 3000 > initialLoadCommits，保证 boot 后有「加载更多」按钮） */
	var totalCommits = 3000;

	/** 生成 n 条线性提交（index 0 最新，head 指向 c0），每隔 50 条塞一个合并父提交 */
	function genCommits(n) {
		var commits = [];
		for (var i = 0; i < n; i++) {
			commits.push({
				hash: 'c' + i,
				parents: i + 1 < n ? ['c' + (i + 1)] : [],
				author: 'Author',
				email: 'author@example.com',
				date: NOW - i * 3600,
				message: 'Commit number ' + i,
				heads: i === 0 ? ['main'] : [],
				tags: [],
				remotes: [],
				stash: null,
			});
		}
		return commits;
	}

	var config = {
		commitDetailsView: { autoCenter: true, fileTreeCompactFolders: true, fileViewType: 0, location: 0 },
		commitOrdering: 'date',
		/* 右键菜单可见性：真实后端传完整结构，代码直接读子字段，缺了会崩 */
		contextMenuActionsVisibility: {
			branch: { checkout: true, rename: true, delete: true, merge: true, rebase: true, push: true, pull: true, createBranch: true, viewIssue: true, createPullRequest: true, createArchive: true, selectInBranchesDropdown: true, unselectInBranchesDropdown: true, copyName: true },
			commit: { addTag: true, createBranch: true, checkout: true, cherrypick: true, revert: true, drop: true, merge: true, rebase: true, reset: true, undo: true, editMessage: true, copyHash: true, copySubject: true },
			commitDetailsViewFile: { viewDiff: true, viewFileAtThisRevision: true, viewDiffWithWorkingFile: true, openFile: true, markAsReviewed: true, markAsNotReviewed: true, resetFileToThisRevision: true, copyAbsoluteFilePath: true, copyRelativeFilePath: true },
			remoteBranch: { checkout: true, delete: true, fetch: true, merge: true, pull: true, createBranch: true, viewIssue: true, createPullRequest: true, createArchive: true, selectInBranchesDropdown: true, unselectInBranchesDropdown: true, copyName: true },
			stash: { apply: true, createBranch: true, pop: true, drop: true, copyName: true, copyHash: true },
			tag: { viewDetails: true, delete: true, push: true, createArchive: true, copyName: true },
			uncommittedChanges: { stash: true, reset: true, clean: true, openSourceControlView: true },
		},
		customBranchGlobPatterns: [],
		customEmojiShortcodeMappings: [],
		customPullRequestProviders: [],
		dateFormat: { type: 0, iso: false },
		defaultColumnVisibility: { date: true, author: true, commit: true },
		dialogDefaults: {},
		enhancedAccessibility: false,
		language: 'en',
		fetchAndPrune: false,
		fetchAndPruneTags: false,
		fetchAvatars: false,
		graph: {
			colours: ['#0085d9', '#d9008f', '#00d90a', '#d98500', '#a300d9', '#ff0000', '#00d9cc', '#e138e8', '#85d900', '#dc5b23', '#6f24d6', '#ffcc00'],
			fontSize: 13,
			rowHeight: 24,
			style: 0,
			grid: { x: 16, y: 24, offsetX: 16, offsetY: 12, expandY: 250 },
			uncommittedChanges: 0,
		},
		includeCommitsMentionedByReflogs: false,
		initialLoadCommits: 500,
		keybindings: { find: null, refresh: null, scrollToHead: null, scrollToStash: null },
		loadMoreCommits: 500,
		loadMoreCommitsAutomatically: false,
		markdown: false,
		mute: { commitsNotAncestorsOfHead: false, mergeCommits: false },
		showBodyInline: false,
		showCommitBodyInline: false,
		onlyFollowFirstParent: false,
		onRepoLoad: { scrollToHead: false, showCheckedOutBranch: true, showSpecificBranches: [] },
		referenceLabels: { branchLabelsAlignedToGraph: false, combineLocalAndRemoteBranchLabels: false, tagLabelsOnRight: false },
		repoDropdownOrder: 0,
		showRemoteBranches: true,
		showStashes: false,
		showTags: true,
		stickyHeader: false,
		unmergedBranches: { enabled: false, showBar: false, maxBarEntries: 5, baseBranch: 'HEAD' },
	};

	/* 复刻后端 getHtmlForWebview() 动态注入的分支颜色样式（不在 out.min.css 文件里） */
	(function injectColourVars() {
		var css = 'body{';
		for (var i = 0; i < config.graph.colours.length; i++) {
			css += '--git-graph-color' + i + ':' + config.graph.colours[i] + '; ';
		}
		css += '} ';
		for (var j = 0; j < config.graph.colours.length; j++) {
			css += '[data-color="' + j + '"]{--git-graph-color:var(--git-graph-color' + j + ');} ';
		}
		var style = document.createElement('style');
		style.textContent = css;
		document.head.appendChild(style);
	})();

	var repoState = {
		cdvDivider: 300,
		cdvHeight: 250,
		columnWidths: null,
		commitOrdering: 'default',
		fileViewType: 0,
		hideRemotes: [],
		includeCommitsMentionedByReflogs: 0,
		issueLinkingConfig: null,
		lastImportAt: 0,
		name: 'test-repo',
		onlyFollowFirstParent: 0,
		onRepoLoadShowCheckedOutBranch: 0,
		onRepoLoadShowSpecificBranches: null,
		pullRequestConfig: null,
		showRemoteBranches: true,
		showRemoteBranchesV2: 0,
		showStashes: 0,
		showTags: 0,
		workspaceFolderIndex: 0,
	};

	window.initialState = {
		config: config,
		lastActiveRepo: REPO,
		loadViewTo: null,
		repos: (function () { var s = {}; s[REPO] = repoState; return s; })(),
		loadRepoInfoRefreshId: 0,
		loadCommitsRefreshId: 0,
	};
	window.globalState = { alwaysAcceptCheckoutCommit: false, issueLinkingConfig: null, pushTagSkipRemoteCheck: false, hideLogiCarAd: true };
	window.workspaceState = { findIsCaseSensitive: false, findIsRegex: false, findOpenCommitDetailsView: false };
	window.vscodeLanguage = 'en';

	/** 假后端：应答 webview 发出的每条请求（echo refreshId），经 window.postMessage 回给 app */
	function fakeBackend(req) {
		switch (req.command) {
			case 'loadRepoInfo':
				respond({ command: 'loadRepoInfo', error: null, refreshId: req.refreshId, branches: ['main'], head: 'main', remotes: [], stashes: [], isRepo: true, unmergedBranches: [] });
				break;
			case 'loadCommits': {
				var n = Math.min(req.maxCommits, totalCommits);
				respond({
					command: 'loadCommits', error: null, refreshId: req.refreshId,
					commits: genCommits(n),
					head: n > 0 ? 'c0' : null,
					tags: [],
					moreCommitsAvailable: n < totalCommits,
					onlyFollowFirstParent: false,
				});
				break;
			}
			case 'loadConfig':
				respond({ command: 'loadConfig', repo: req.repo, config: null });
				break;
			case 'commitDetails': {
				/* 行内 CDV 展开用的提交详情（含文件变更，撑起 expandY 对齐路径） */
				var idx = parseInt(req.commitHash.slice(1), 10);
				respond({
					command: 'commitDetails', error: null,
					commitDetails: {
						hash: req.commitHash,
						parents: idx + 1 < totalCommits ? ['c' + (idx + 1)] : [],
						author: 'Author',
						authorEmail: 'author@example.com',
						authorDate: NOW - idx * 3600,
						committer: 'Author',
						committerEmail: 'author@example.com',
						committerDate: NOW - idx * 3600,
						signature: null,
						body: 'Full body of commit ' + req.commitHash,
						fileChanges: [
							{ oldFilePath: 'src/file-' + idx + '.ts', newFilePath: 'src/file-' + idx + '.ts', type: 'M', additions: 10, deletions: 2 },
							{ oldFilePath: 'README.md', newFilePath: 'README.md', type: 'M', additions: 3, deletions: 1 },
						],
					},
					avatar: null,
					codeReview: null,
					refresh: req.refresh,
				});
				break;
			}
			case 'loadRepos':
				respond({ command: 'loadRepos', repos: window.initialState.repos, lastActiveRepo: REPO, loadViewTo: null });
				break;
			default:
				/* showErrorMessage / setGlobalViewState / setWorkspaceViewState 等：忽略 */
				break;
		}
	}

	function respond(msg) {
		setTimeout(function () { window.postMessage(msg, '*'); }, 0);
	}

	/** WebView API mock：getState 恒为 null，保证每次页面加载都是全新 boot */
	var api = {
		getState: function () { return null; },
		setState: function (s) { return s; },
		postMessage: function (msg) { fakeBackend(msg); },
	};
	window.acquireVsCodeApi = function () { return api; };

	function verdict(text, ok) {
		var el = document.getElementById('harnessVerdict');
		el.textContent = text;
		el.style.border = '2px solid ' + (ok ? '#3fb950' : '#f85149');
	}

	window.__gg = {
		/** 设置假仓库提交总数（下一次 loadCommits 生效） */
		setTotal: function (n) { totalCommits = n; },
		/** 触发 app 内 refresh（后端推送 refresh 消息等价于点刷新按钮） */
		refresh: function () { window.postMessage({ command: 'refresh' }, '*'); },
		/** 点击「加载更多」按钮 */
		loadMore: function () {
			var b = document.getElementById('loadMoreCommitsBtn');
			if (!b) throw new Error('#loadMoreCommitsBtn not found');
			b.click();
		},
		/** 等待表格行数达到 n（再等 150ms 让 graph SVG 渲染完成） */
		waitForRows: function (n, timeout) {
			return new Promise(function (resolve, reject) {
				var t0 = Date.now();
				(function poll() {
					var rows = document.querySelectorAll('#commitTable tr.commit').length;
					if (rows === n) { setTimeout(function () { resolve(n); }, 150); return; }
					if (Date.now() - t0 > (timeout || 10000)) { reject(new Error('waitForRows(' + n + ') timeout, current=' + rows)); return; }
					setTimeout(poll, 50);
				})();
			});
		},
		/**
		 * 测量对齐度：对每个 commit 行，比较「行中心相对 #content 顶部的距离」与
		 * 对应 SVG 圆点的 cy（同一坐标系）。返回最大偏差及最差行号。
		 */
		measure: function () {
			var contentTop = document.getElementById('content').getBoundingClientRect().top;
			var rows = document.querySelectorAll('#commitTable tr.commit');
			var circles = {};
			document.querySelectorAll('#commitGraph circle[data-id]').forEach(function (c) { circles[c.dataset.id] = c; });
			var maxErr = 0, worst = -1, paired = 0, sumErr = 0;
			rows.forEach(function (row) {
				var c = circles[row.dataset.id];
				if (!c) return;
				paired++;
				var r = row.getBoundingClientRect();
				var rowCenter = r.top + r.height / 2 - contentTop;
				var err = Math.abs(rowCenter - parseFloat(c.getAttribute('cy')));
				sumErr += err;
				if (err > maxErr) { maxErr = err; worst = Number(row.dataset.id); }
			});
			return {
				rows: rows.length,
				vertices: Object.keys(circles).length,
				paired: paired,
				maxErr: Math.round(maxErr * 1000) / 1000,
				meanErr: paired > 0 ? Math.round((sumErr / paired) * 1000) / 1000 : -1,
				worstRow: worst,
			};
		},
		setVerdict: verdict,
	};
})();
</script>
<!-- 被测对象：真实构建产物 -->
<script src="../../../media/out.min.js"></script>
</body>
</html>
